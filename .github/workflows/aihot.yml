name: 更新 RSS

on:
  schedule:
    - cron: "*/30 22-23,0-14 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成 RSS
        run: python aihot_rss.py docs/aihot.xml

      - name: 测试化工网
        run: |
          python3 -c "
import http.cookiejar
from urllib.request import build_opener, HTTPCookieProcessor
cj = http.cookiejar.CookieJar()
opener = build_opener(HTTPCookieProcessor(cj))
opener.addheaders = [('User-Agent', 'Mozilla/5.0')]
resp = opener.open('https://china.chemnet.com/fx/intelligence.php')
html = resp.read().decode('gb2312', errors='replace')
print('LENGTH:', len(html))
print('HAS 甲苯:', '甲苯' in html)
print('HAS WAF:', '安全检查' in html)
print(html[:300])
"

      - name: 提交更新
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add docs/aihot.xml
          git diff --staged --quiet || git commit -m "update RSS"
          git push
